<head>
	<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<!-- Favicon set (favicon/) generated via realfavicongenerator.net -->
	<link rel="icon" type="image/png" href="{{ "favicon/favicon-96x96.png" | relative_url }}" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="{{ "favicon/favicon.svg" | relative_url }}" />
	<link rel="shortcut icon" href="{{ "favicon/favicon.ico" | relative_url }}" />
	<link rel="apple-touch-icon" sizes="180x180" href="{{ "favicon/apple-touch-icon.png" | relative_url }}" />
	<link rel="manifest" href="{{ "favicon/site.webmanifest" | relative_url }}" />
	<meta name="apple-mobile-web-app-title" content="{{ site.title }}" />
	<meta name="theme-color" content="#1f4fe0" />
	<!--[if lte IE 8]><script src="{{ "assets/js/ie/html5shiv.js" | relative_url }}"></script><![endif]-->
	<!-- Playfair Display (headings) + Source Sans Pro (body) — matches
	     Clients/SaraRomero/04_Brand/sara_romero_brand_guide_v1.html -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ "assets/css/main.css" | relative_url }}" />
	<!--[if lte IE 9]><link rel="stylesheet" href="{{ "assets/css/ie9.css" | relative_url }}" /><![endif]-->
	<!--[if lte IE 8]><link rel="stylesheet" href="{{ "assets/css/ie8.css" | relative_url }}" /><![endif]-->
</head>
