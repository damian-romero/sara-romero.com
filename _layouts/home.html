<html>

{% include head.html %}

<body>

    {% include header.html %}

    <!-- Banner -->
    <section id="banner" class="major">
        <div class="inner">
            <header class="major">
                <h1>{{ page.landing-title }}</h1>
            </header>
            <div class="content">
                <p style="text-transform: uppercase;">{{ site.subtitle }}</p>
                <ul class="actions">
                    <!-- .special (solid fill) instead of the default outlined .next button:
                         the outline + arrow icon are hardcoded to a dark stroke color in the
                         theme's SVG, which would be invisible against the photo scrim. -->
                    <li><a href="#one" class="button special scrolly">Conoce más</a></li>
                </ul>
            </div>
        </div>
    </section>

    <!-- Main -->
    <div id="main">

        <!-- One -->
        {% include tiles.html %}

        <!-- Two -->
        <section id="two">
            <div class="inner">
                <header class="major">
                    <h2>Sobre Sara</h2>
                </header>
                <p>{{ content }}</p>
                <ul class="actions">
                    <li><a href="trayectoria.html" class="button next">Ver trayectoria</a></li>
                </ul>
            </div>
        </section>

    </div>

    {% include footer.html %}

</body>

</html>
