  Instagram: https://www.instagram.com/edicionesvivace
  LinkedIn: # TBD — add once Sara's LinkedIn page exists (quote includes "creación de página de LinkedIn")
  GitHub:
  GitLab:
  Google-Plus:
  Twitter:
  Slack:

# build settings
markdown: kramdown

sass:
  style: compressed

exclude:
- "*.gemspec"
- LICENSE.md
- CONTRIBUTING.md
- README.md
- Gemfile
- Gemfile.lock
